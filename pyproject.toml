[tool.poetry]
name = "genrevive-migrator-swing2angular-poc"
version = "0.1.0"
authors = ["Vanio Begic, Kristina Peteln"]
description = "GenRevive Migrator - Java Swing to Angular PoC"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
python-dotenv = "1.0.0"
genrevive = { path = "../genrevive", develop = false }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
